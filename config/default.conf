# ViCURA Configuration File
# Lines starting with # are comments
# Format: key=value

# Workspace directory (where intermediate and output files are stored)
workspace=/mnt/sda2/ViCURA/workspace

# Input FASTQ files (paired-end reads)
input_R1=/mnt/sda2/ViCURA/data/shi_double_corrected_R1.fastq
input_R2=/mnt/sda2/ViCURA/data/shi_double_corrected_R2.fastq

# K-mer parameters
minimizer_size=5
kmer_length=150
read_length_normal=150

# Overlap parameters for OLC construction
overlap_min=25
overlap_max=149

# Number of subgraphs to select
subgraph_select_number=5

# Execution mode (true for MPI parallel, false for sequential)
use_mpi=false

# Pipeline stages (true to enable, false to disable)
build_olc=true
extract_subgraphs=true
detect_cycles=true
build_dbg=false

# For parallel mode: path to pre-computed OLC data
# olc_input_path=/home/qch/OLCtemp/OLC_2_28_combine

# Reference paths (optional, for advanced analysis)
# ref_path=/home/qch/reference.fasta
# strain_path=/home/qch/strains
